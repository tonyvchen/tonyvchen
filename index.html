<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony Chen</title>
<meta name="description" content="Tony Chen — electrical and computer engineering student at UCLA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,800&family=IBM+Plex+Mono:wght@400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4E7E3;
    --ink:#171A19;
    --graphite:#5C635F;
    --rule:#B9C0BA;
    --blue:#1B3AC4;
  }

  *,*::before,*::after{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(2rem,7vw,5rem) clamp(1.5rem,6vw,5rem);
    background:var(--paper);
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  main{width:100%;max-width:44rem}

  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--graphite);
    margin:0;
  }

  h1{
    font-family:"Bricolage Grotesque",sans-serif;
    font-variation-settings:"wdth" 88;
    font-weight:800;
    font-size:clamp(3.2rem,13vw,7rem);
    line-height:.88;
    letter-spacing:-.03em;
    margin:.5rem 0 0;
  }

  hr{
    border:none;
    border-top:1px solid var(--rule);
    margin:2rem 0;
  }

  p.bio{
    font-size:clamp(1.05rem,2.2vw,1.22rem);
    max-width:32em;
    margin:0;
    color:#2A2F2C;
  }

  nav{
    margin-top:2.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:.6rem 2rem;
  }

  nav a{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.78rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1.5px solid var(--blue);
    padding-bottom:.2rem;
  }
  nav a:hover{color:var(--blue)}
  nav a:focus-visible{outline:2.5px solid var(--blue);outline-offset:4px}

  footer{
    margin-top:3.5rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    letter-spacing:.08em;
    color:var(--graphite);
  }
  footer a{color:var(--graphite)}
</style>
</head>
<body>

<main>
  <p class="eyebrow">Electrical &amp; Computer Engineering &nbsp;/&nbsp; UCLA</p>
  <h1>Tony<br>Chen</h1>

  <hr>

  <p class="bio">Talent in the hands of a Jester.</p>

  <nav>
    <a href="projects.html">Projects</a>
    <a href="Tony_Chen_Resume.pdf">Resume (PDF)</a>
    <a href="mailto:tonychen1@ucla.edu">Email</a>
  </nav>

  <footer>Pittsburgh, PA</footer>
</main>

</body>
</html>
