<script>
(function () {
  // Bump VERSION whenever you replace the PDF. It changes the request URL,
  // so browsers and Cloudflare fetch the new file instead of a cached copy.
  var VERSION = '2026-10-14';
  var BASE    = 'Tony_Chen_Resume.pdf';
  var FILE    = BASE + '?v=' + VERSION;

  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

  var pages  = document.getElementById('pages');
  var status = document.getElementById('status');

  function fail(msg) {
    if (!status.parentNode) return;
    status.innerHTML = msg + ' <a href="' + FILE + '">Open the PDF directly &rarr;</a>';
  }

  var dl = document.getElementById('dl');
  if (dl) dl.href = FILE;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error(src)); };
      document.head.appendChild(s);
    });
  }

  // Prefer the copy in this repo; fall back to the CDN if it isn't there.
  var workerSrc = 'vendor/pdf.worker.min.js';
  loadScript('vendor/pdf.min.js')
    .catch(function () {
      workerSrc = CDN + 'pdf.worker.min.js';
      return loadScript(CDN + 'pdf.min.js');
    })
    .then(start)
    .catch(function () { fail("The viewer couldn't load."); });

  var doc = null, lastWidth = 0, rendering = false;

  function start() {
    if (!window.pdfjsLib) { fail("The viewer couldn't load."); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;
    pdfjsLib.getDocument(FILE).promise
      .then(function (pdf) { doc = pdf; render(); })
      .catch(function () { fail("The resume couldn't be loaded."); });
  }

  function render() {
    if (!doc || rendering) return;
    var width = pages.clientWidth;
    if (!width) return;
    rendering = true;

    // Cap the backing store so high-DPI screens don't allocate needlessly.
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var jobs = [];
    for (var i = 1; i <= doc.numPages; i++) jobs.push(doc.getPage(i));

    Promise.all(jobs).then(function (loaded) {
      var frag = document.createDocumentFragment();
      var chain = Promise.resolve();

      loaded.forEach(function (page) {
        var base = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: (width / base.width) * dpr });
        var canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Resume page ' + page.pageNumber);
        frag.appendChild(canvas);

        chain = chain.then(function () {
          return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        });
      });

      return chain.then(function () {
        pages.innerHTML = '';
        pages.appendChild(frag);
        if (status.parentNode) status.parentNode.removeChild(status);
        lastWidth = width;
        rendering = false;
      });
    }).catch(function () {
      rendering = false;
      fail("The viewer couldn't render this file.");
    });
  }

  // Re-render on meaningful width changes so the text stays sharp.
  var timer = null;
  window.addEventListener('resize', function () {
    if (!doc) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (Math.abs(pages.clientWidth - lastWidth) > 40) render();
    }, 250);
  });
})();
</script>
